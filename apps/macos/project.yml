name: ZenTask
options:
  bundleIdPrefix: com.vuhpquang
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  # Shared updater / About / Settings shell — git submodule at the repo root (git submodule update --init).
  AppShell:
    path: ../../Vendor/app-shell
settings:
  base:
    MARKETING_VERSION: 0.15.0
    CURRENT_PROJECT_VERSION: 39
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  ZenTask:
    type: application
    platform: macOS
    sources:
      - ZenTask
      - Shared
    dependencies:
      - target: ZenTaskWidget
      - framework: ../../shared/build/XCFrameworks/release/ZenTaskShared.xcframework
        embed: false
      - package: AppShell
        product: AppShellCore
      - package: AppShell
        product: UpdaterKit
      - package: AppShell
        product: AboutKit
      - package: AppShell
        product: SettingsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vuhpquang.zentask
        PRODUCT_NAME: ZenTask
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZenTask
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Ha Phung Quang Vu"
        ASSETCATALOG_COMPILER_APPICON_NAME: ZenTask
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++", "-lsqlite3"]
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vuhpquang.zentask.dev
    info:
      path: ZenTask/Info.plist
      properties:
        NSLocationUsageDescription: ZenTask reads the Wi-Fi name to remind you about tasks when you arrive at or leave a saved place.
        NSLocationWhenInUseUsageDescription: ZenTask reads the Wi-Fi name to remind you about tasks when you arrive at or leave a saved place.
        CFBundleURLTypes:
          - CFBundleURLName: com.vuhpquang.zentask.task-link
            CFBundleURLSchemes: [zentask]
  ZenTaskWidget:
    # Desktop widgets (Today, Countdown). Sandboxed; reads the app's widget.json (read-only exception).
    type: app-extension
    platform: macOS
    sources:
      - ZenTaskWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vuhpquang.zentask.widget
        PRODUCT_NAME: ZenTaskWidget
        CODE_SIGN_ENTITLEMENTS: ZenTaskWidget/ZenTaskWidget.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@executable_path/../../../../Frameworks"]
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vuhpquang.zentask.dev.widget
    info:
      path: ZenTaskWidget/Info.plist
      properties:
        CFBundleDisplayName: ZenTask
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ZenTaskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ZenTaskTests
    dependencies:
      - target: ZenTask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vuhpquang.zentask.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZenTask.app/Contents/MacOS/ZenTask"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ZenTask:
    build:
      targets:
        ZenTask: all
        ZenTaskTests: [test]
    test:
      targets:
        - ZenTaskTests
